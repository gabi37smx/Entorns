<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projecte ED1 - Gabriel Vidal</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --card: rgba(15, 23, 42, 0.82);
            --card-soft: rgba(148, 163, 184, 0.12);
            --accent: #7c3aed;
            --accent-2: #38bdf8;
            --accent-3: #34d399;
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --line: rgba(148, 163, 184, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.28), transparent 30%),
                radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.25), transparent 35%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
        }

        .container {
            position: relative;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
            padding: 36px 34px;
            max-width: 720px;
            width: 100%;
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0 auto auto 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent-2), var(--accent), var(--accent-3));
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--accent-2);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2rem, 3vw, 3rem);
            margin-bottom: 12px;
            color: #f8fafc;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        h2 {
            color: #c4b5fd;
            font-size: 1.2rem;
            margin-bottom: 26px;
            font-weight: 600;
        }

        .intro {
            background: var(--card-soft);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 24px;
        }

        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 14px;
        }

        .nom {
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-2), #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-top: 26px;
        }

        .meta-item {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 16px;
            text-align: center;
        }

        .meta-label {
            display: block;
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-2);
            margin-bottom: 8px;
        }

        .meta-value {
            color: #f8fafc;
            font-weight: 700;
            font-size: 1rem;
        }

        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        @media (max-width: 560px) {
            .container {
                padding: 28px 20px;
            }

            .footer {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">ED1</div>
        <h1>Projecte ED1</h1>
        <h2>Introducció al Desenvolupament del Programari</h2>

        <div class="intro">
            <p>Hola, em dic <span class="nom">Gabriel Vidal</span>.</p>
            <p>Aquesta és la meva primera pàgina web per a la classe d'<strong>Entorns de Desenvolupament</strong>.</p>
        </div>

        <div class="meta">
            <div class="meta-item">
                <span class="meta-label">Tema</span>
                <span class="meta-value">UD2 → A21</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">Curs</span>
                <span class="meta-value">1r DAM</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">Professor</span>
                <span class="meta-value">Juan Mateu</span>
            </div>
        </div>

        <div class="footer">
            <span>Entorns de Desenvolupament</span>
            <span>Projecte acadèmic</span>
        </div>
    </div>
</body>
</html>
